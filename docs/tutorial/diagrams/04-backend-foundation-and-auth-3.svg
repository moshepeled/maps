<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Access token, refresh cookie and rotation">
  <title>Access token, refresh cookie and rotation</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b95a4"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #e8ebf0; font-size: 15px; }
      .title { font-size: 21px; font-weight: 600; }
      .h { font-size: 16px; font-weight: 600; }
      .m { fill: #8b95a4; font-size: 14px; }
      .a { fill: #22d3ee; }
      .code { font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 14px; }
      .box { fill: #1a1f26; stroke: #3a4250; stroke-width: 1.5; }
      .hi { stroke: #22d3ee; }
      .ln { stroke: #22d3ee; stroke-width: 2; fill: none; marker-end: url(#arr); }
      .lm { stroke: #8b95a4; stroke-width: 1.5; fill: none; marker-end: url(#arrm); }
    </style>
  </defs>
  <rect width="960" height="600" fill="#111418"/>
  <text x="24" y="38" class="title">Access token, refresh cookie and rotation</text>

  <!-- Browser -->
  <rect x="24" y="70" width="180" height="200" rx="12" class="box hi"/>
  <text x="114" y="96" text-anchor="middle" class="h">Browser (SPA)</text>
  <text x="40" y="124" class="m">memory:</text>
  <text x="40" y="144" class="code a">accessToken (JWT)</text>
  <text x="40" y="164" class="m">TTL 15 min, never stored</text>
  <text x="40" y="192" class="m">cookie jar:</text>
  <text x="40" y="212" class="code a">snap_rt  HttpOnly</text>
  <text x="40" y="232" class="code">SameSite=Strict</text>
  <text x="40" y="252" class="code">Path=/api/v1/auth</text>

  <!-- Backend routes -->
  <rect x="300" y="70" width="300" height="56" rx="10" class="box"/>
  <text x="316" y="94" class="code">POST /api/v1/auth/login</text>
  <text x="316" y="114" class="m">argon2id verify, session INSERT, sign JWT</text>

  <rect x="300" y="150" width="300" height="56" rx="10" class="box"/>
  <text x="316" y="174" class="code">any route with app.authenticate</text>
  <text x="316" y="194" class="m">HS256 verify, EXISTS revoked:&lt;sid&gt;</text>

  <rect x="300" y="230" width="300" height="56" rx="10" class="box"/>
  <text x="316" y="254" class="code">POST /api/v1/auth/refresh</text>
  <text x="316" y="274" class="m">one transaction, SELECT ... FOR UPDATE</text>

  <rect x="300" y="310" width="300" height="140" rx="10" class="box hi"/>
  <text x="316" y="334" class="h">decideRotation(row, dbNow)</text>
  <text x="316" y="360" class="code">current &amp; live -> rotate</text>
  <text x="316" y="382" class="code">previous, <= 10 s -> 401 (tab race)</text>
  <text x="316" y="404" class="code a">previous, &gt; 10 s -> REUSE -> revoke</text>
  <text x="316" y="426" class="code">revoked/disabled -> SESSION_REVOKED</text>

  <!-- Stores -->
  <rect x="700" y="70" width="236" height="200" rx="12" class="box"/>
  <text x="716" y="96" class="h">PostgreSQL: sessions</text>
  <text x="716" y="122" class="code">refresh_token_hash</text>
  <text x="716" y="142" class="code">previous_token_hash</text>
  <text x="716" y="162" class="code">rotated_at</text>
  <text x="716" y="182" class="code">expires_at (sliding 14 d)</text>
  <text x="716" y="202" class="code">absolute_expires_at (30 d)</text>
  <text x="716" y="222" class="code">revoked_at, revoked_reason</text>
  <text x="716" y="250" class="m">only SHA-256 hashes, never tokens</text>

  <rect x="700" y="300" width="236" height="64" rx="12" class="box"/>
  <text x="716" y="324" class="h">Redis</text>
  <text x="716" y="348" class="code">revoked:&lt;sid&gt;  EX 900 s</text>

  <rect x="700" y="394" width="236" height="64" rx="12" class="box"/>
  <text x="716" y="418" class="h">Redis pub/sub  ch:sessions</text>
  <text x="716" y="442" class="m">every gateway closes sockets 4401</text>

  <!-- Arrows browser <-> backend -->
  <line x1="204" y1="88" x2="298" y2="88" class="ln"/>
  <text x="251" y="80" text-anchor="middle" class="m">credentials</text>
  <line x1="300" y1="112" x2="206" y2="112" class="ln"/>
  <text x="251" y="132" text-anchor="middle" class="m">JSON + Set-Cookie</text>

  <line x1="204" y1="178" x2="298" y2="178" class="ln"/>
  <text x="251" y="170" text-anchor="middle" class="m">Bearer header</text>

  <line x1="204" y1="258" x2="298" y2="258" class="ln"/>
  <text x="251" y="250" text-anchor="middle" class="m">cookie only</text>

  <!-- Arrows backend -> stores -->
  <line x1="600" y1="98" x2="698" y2="98" class="ln"/>
  <text x="649" y="90" text-anchor="middle" class="m">INSERT</text>

  <line x1="600" y1="178" x2="698" y2="320" class="lm"/>
  <text x="640" y="232" class="m">EXISTS</text>

  <line x1="600" y1="258" x2="698" y2="258" class="ln"/>
  <text x="649" y="250" text-anchor="middle" class="m">FOR UPDATE</text>

  <line x1="450" y1="286" x2="450" y2="308" class="ln"/>

  <line x1="600" y1="404" x2="698" y2="340" class="ln"/>
  <text x="650" y="392" text-anchor="middle" class="m">SET (mark)</text>
  <line x1="600" y1="420" x2="698" y2="426" class="ln"/>
  <text x="650" y="446" text-anchor="middle" class="m">publish</text>

  <!-- Bottom notes -->
  <text x="24" y="500" class="m">Rotate = previous_token_hash := current, refresh_token_hash := new, rotated_at := now(), expires_at := min(now + 14 d, absolute).</text>
  <text x="24" y="524" class="m">The database row is authoritative. The Redis mark and the bus event are best effort: they only make revocation immediate</text>
  <text x="24" y="546" class="m">instead of "within 15 minutes" (token expiry) and "within one re-validation round" (sockets, chapter 6).</text>
  <text x="24" y="578" class="m">Tabs serialise refreshes with the Web Locks API (frontend/src/auth/session.ts), so two tabs never look like token reuse.</text>
</svg>
