<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t3 d3">
  <title id="t3">The drawing pipeline: from a click to a stored point, and from the store to the screen</title>
  <desc id="d3">Top row: a Leaflet click goes through MapController.onDrawingClick, DrawingFlow.place and drawingReducer.addPoint into the drawing store. Middle row: pointer moves go through DrawingFlow.pointer and setPointer into the same store. Bottom row: on the next frame deriveDrawing feeds the OwnDraftLayer and the options-bar readout. A separate arrow from DrawingFlow.place shows that place and pointer call DrawingFlow.stream directly, which sends the draft to DraftSession.update over the WebSocket.</desc>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b95a4"/>
    </marker>
    <marker id="c3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="960" height="580" fill="#111418"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#e8ebf0" font-size="14">
    <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="600">Drawing: a click becomes a 7-dp WGS84 point; the screen is derived from the store</text>

    <!-- boxes -->
    <g fill="#1a1e25" stroke="#3a414c" stroke-width="1.4">
      <rect x="30" y="80" width="150" height="84" rx="10"/>
      <rect x="210" y="80" width="190" height="84" rx="10"/>
      <rect x="430" y="80" width="150" height="84" rx="10"/>
      <rect x="610" y="80" width="200" height="84" rx="10"/>
      <rect x="840" y="80" width="100" height="194" rx="10" stroke="#22d3ee"/>
      <rect x="30" y="210" width="150" height="64" rx="10"/>
      <rect x="210" y="210" width="190" height="64" rx="10"/>
      <rect x="430" y="210" width="150" height="64" rx="10"/>
      <rect x="30" y="340" width="260" height="84" rx="10" stroke="#22d3ee"/>
      <rect x="330" y="340" width="180" height="84" rx="10"/>
      <rect x="540" y="340" width="190" height="84" rx="10"/>
      <rect x="760" y="340" width="180" height="84" rx="10"/>
    </g>
    <g text-anchor="middle">
      <text x="105" y="108" font-weight="600">Leaflet click</text>
      <text x="105" y="128">Space at reticle</text>
      <text x="105" y="148" fill="#8b95a4">(lat, lng)</text>

      <text x="305" y="104" font-weight="600">MapController</text>
      <text x="305" y="122">.onDrawingClick</text>
      <text x="305" y="140" fill="#8b95a4">first <= 12 px -> finish</text>
      <text x="305" y="156" fill="#8b95a4">last <= 6 px -> ignore</text>

      <text x="505" y="108" font-weight="600">DrawingFlow</text>
      <text x="505" y="128">.place(position)</text>
      <text x="505" y="148" fill="#8b95a4">announces result</text>

      <text x="710" y="102" font-weight="600">drawingReducer</text>
      <text x="710" y="120">.addPoint: 7 dp</text>
      <text x="710" y="138" fill="#8b95a4">refuses crossing, fold,</text>
      <text x="710" y="154" fill="#8b95a4">range, max points</text>

      <text x="890" y="170" font-weight="600" fill="#22d3ee">drawing</text>
      <text x="890" y="188" font-weight="600" fill="#22d3ee">store</text>
      <text x="890" y="210">points[]</text>
      <text x="890" y="226">pointer</text>
      <text x="890" y="242">refusal</text>

      <text x="105" y="236" font-weight="600">mousemove</text>
      <text x="105" y="256" fill="#8b95a4">1 per frame</text>
      <text x="305" y="236" font-weight="600">DrawingFlow.pointer</text>
      <text x="305" y="256" fill="#8b95a4">null on touch / off map</text>
      <text x="505" y="236" font-weight="600">setPointer</text>
      <text x="505" y="256" fill="#8b95a4">-> provisional point</text>

      <text x="160" y="362" font-weight="600">MapController.render</text>
      <text x="160" y="382">deriveDrawing(state, limits)</text>
      <text x="160" y="400" fill="#8b95a4">readout ring, HUD message</text>
      <text x="160" y="416" fill="#8b95a4">invalid edges, canFinish</text>

      <text x="420" y="366" font-weight="600">OwnDraftLayer.sync</text>
      <text x="420" y="386">edges + rubber-band</text>
      <text x="420" y="402">closing preview, x</text>
      <text x="420" y="418" fill="#8b95a4">points diffed</text>

      <text x="635" y="366" font-weight="600">Options bar readout</text>
      <text x="635" y="386">geodesicArea(ring) km²</text>
      <text x="635" y="402">area-readout[data-km2]</text>
      <text x="635" y="418" fill="#8b95a4">" - " while not simple</text>

      <text x="850" y="366" font-weight="600">DraftSession.update</text>
      <text x="850" y="386">vertices + cursor, 6 dp</text>
      <text x="850" y="402">over the WebSocket</text>
      <text x="850" y="418" fill="#8b95a4">(chapter 8)</text>
    </g>

    <!-- arrows -->
    <g stroke="#8b95a4" stroke-width="1.6" fill="none" marker-end="url(#a3)">
      <line x1="180" y1="122" x2="210" y2="122"/>
      <line x1="400" y1="122" x2="430" y2="122"/>
      <line x1="580" y1="122" x2="610" y2="122"/>
      <line x1="810" y1="122" x2="840" y2="122"/>
      <line x1="180" y1="242" x2="210" y2="242"/>
      <line x1="400" y1="242" x2="430" y2="242"/>
      <line x1="580" y1="242" x2="840" y2="242"/>
      <line x1="290" y1="382" x2="330" y2="382"/>
      <polyline points="160,424 160,460 635,460 635,424"/>
      <polyline points="505,80 505,66 950,66 950,382 940,382"/>
    </g>
    <g stroke="#22d3ee" stroke-width="1.6" fill="none" marker-end="url(#c3)">
      <polyline points="890,274 890,306 160,306 160,340"/>
    </g>
    <g font-size="14" fill="#8b95a4">
      <text x="727" y="57" text-anchor="middle">DrawingFlow.stream(): called by place() and pointer()</text>
      <text x="525" y="300" text-anchor="middle" fill="#22d3ee">store changed -> subscribe -> scheduleRender()</text>
      <text x="400" y="478" text-anchor="middle">the same DrawingView feeds the HUD and the invalid overlay</text>
    </g>
    <text x="480" y="520" text-anchor="middle" font-size="14" fill="#8b95a4">Files: map/MapController.ts, workspace/drawingFlow.ts, state/drawingReducer.ts</text>
    <text x="480" y="540" text-anchor="middle" font-size="14" fill="#8b95a4">lib/drawGeometry.ts, map/OwnDraftLayer.ts, components/Hud.tsx</text>
    <text x="480" y="562" text-anchor="middle" font-size="14" fill="#8b95a4">The reducer is pure: drawingReducer.test.ts runs the same functions with no browser at all.</text>
  </g>
</svg>
