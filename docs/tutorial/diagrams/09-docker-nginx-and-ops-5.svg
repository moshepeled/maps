<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="t5 d5">
  <title id="t5">Graceful stop timeline for a backend replica, nginx and the browser clients</title>
  <desc id="d5">docker compose stop sends SIGTERM to tini, which forwards it to node. The backend marks itself shutting down so /health/ready returns 503 for compose's healthcheck, closes WebSockets with code 1001, drains HTTP, stops background work, flushes audit and closes Redis and the pool, then exits 0 within SHUTDOWN_GRACE_MS 10 s; only the timeout branch (log fatal, exit 1) lies beyond the 10 s gate. nginx has no active checks: it receives SIGQUIT, retries failed upstream connections on the other replica, and closes lingering WebSockets after worker_shutdown_timeout 10 s. Compose kills anything still running after stop_grace_period 15 s. Clients reconnect with backoff and jitter to the other replica.</desc>
  <defs>
    <marker id="ar5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #e8ebf0; font-size: 15px; }
      .h { font-size: 20px; font-weight: 600; }
      .b { font-weight: 600; }
      .m { fill: #8b95a4; font-size: 14px; }
      .s { fill: #e8ebf0; font-size: 13px; }
      .a { fill: #22d3ee; }
      .k { fill: #f87171; font-size: 14px; }
      .box { fill: #1a1f26; stroke: #3a4250; stroke-width: 1.5; }
      .sig { fill: #232a33; stroke: #22d3ee; stroke-width: 1.5; }
      .ln { stroke: #22d3ee; stroke-width: 2; fill: none; marker-end: url(#ar5); }
      .axis { stroke: #8b95a4; stroke-width: 1.5; }
      .gate { stroke: #22d3ee; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .kill { stroke: #f87171; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .lane { stroke: #2a313b; stroke-width: 1; }
    </style>
  </defs>
  <rect width="960" height="640" fill="#111418"/>
  <text x="30" y="40" class="h">Graceful stop: the 15 s after `docker compose stop` (order matters, not scale)</text>

  <!-- time axis -->
  <line x1="60" y1="90" x2="920" y2="90" class="axis"/>
  <text x="52" y="78" class="m">0 s</text>
  <line x1="640" y1="70" x2="640" y2="584" class="gate"/>
  <text x="650" y="64" class="a">10 s: SHUTDOWN_GRACE_MS (backend)</text>
  <text x="650" y="82" class="m">and nginx worker_shutdown_timeout</text>
  <line x1="920" y1="70" x2="920" y2="584" class="kill"/>
  <text x="915" y="106" text-anchor="end" class="k">15 s: stop_grace_period -> SIGKILL</text>

  <!-- lane: backend (every step and exit 0 sit left of the 10 s gate; only the timeout branch lies beyond it) -->
  <line x1="30" y1="112" x2="930" y2="112" class="lane"/>
  <text x="30" y="132" class="b">backend replica (tini -> node, infra/shutdown.ts with close-with-grace)</text>

  <rect x="60" y="146" width="90" height="46" rx="10" class="sig"/>
  <text x="72" y="174" class="s">SIGTERM</text>
  <path d="M150,169 L166,169" class="ln"/>
  <rect x="166" y="146" width="190" height="46" rx="10" class="box"/>
  <text x="176" y="166" class="s">shuttingDown = true</text>
  <text x="176" y="184" class="s">/health/ready -> 503</text>
  <path d="M356,169 L372,169" class="ln"/>
  <rect x="372" y="146" width="215" height="46" rx="10" class="box"/>
  <text x="382" y="166" class="s">preClose: every socket</text>
  <text x="382" y="184" class="s">closed with 1001 (going away)</text>

  <path d="M480,192 L480,206 L110,206 L110,218" class="ln"/>
  <rect x="60" y="218" width="120" height="60" rx="10" class="box"/>
  <text x="70" y="244" class="s">app.close():</text>
  <text x="70" y="262" class="s">drain HTTP</text>
  <path d="M180,248 L196,248" class="ln"/>
  <rect x="196" y="218" width="150" height="60" rx="10" class="box"/>
  <text x="206" y="244" class="s">snap.stop(): timers,</text>
  <text x="206" y="262" class="s">locks, presence.left</text>
  <path d="M346,248 L362,248" class="ln"/>
  <rect x="362" y="218" width="270" height="60" rx="10" class="box"/>
  <text x="372" y="238" class="s">container.close(): audit flush (<= 5 s)</text>
  <text x="372" y="254" class="s">-> Redis QUIT (cmd, sub, cache)</text>
  <text x="372" y="270" class="s">-> pg pool end()</text>

  <path d="M497,278 L497,292 L110,292 L110,304" class="ln"/>
  <rect x="60" y="304" width="90" height="46" rx="10" class="sig"/>
  <text x="85" y="332" class="s">exit 0</text>
  <text x="652" y="332" class="k">10 s reached first -> log fatal, exit 1</text>

  <!-- lane: nginx -->
  <line x1="30" y1="376" x2="930" y2="376" class="lane"/>
  <text x="30" y="396" class="b">nginx (STOPSIGNAL SIGQUIT, no extra init needed; no active health checks)</text>
  <rect x="60" y="410" width="100" height="46" rx="10" class="sig"/>
  <text x="72" y="438" class="s">SIGQUIT</text>
  <path d="M160,433 L176,433" class="ln"/>
  <rect x="176" y="410" width="280" height="46" rx="10" class="box"/>
  <text x="186" y="430" class="s">stop accepting; finish in-flight requests</text>
  <text x="186" y="448" class="s">(a WebSocket never "finishes")</text>
  <path d="M456,433 L472,433" class="ln"/>
  <rect x="472" y="410" width="300" height="46" rx="10" class="box"/>
  <text x="482" y="430" class="s">worker_shutdown_timeout 10s: close lingering</text>
  <text x="482" y="448" class="s">WebSockets, then workers exit</text>
  <path d="M772,433 L788,433" class="ln"/>
  <rect x="788" y="410" width="80" height="46" rx="10" class="sig"/>
  <text x="810" y="438" class="s">exit</text>

  <!-- lane: clients -->
  <line x1="30" y1="486" x2="930" y2="486" class="lane"/>
  <text x="30" y="506" class="b">browser clients (chapter 8: RealtimeClient)</text>
  <rect x="60" y="520" width="250" height="46" rx="10" class="box"/>
  <text x="70" y="540" class="s">socket closed 1001 -></text>
  <text x="70" y="558" class="s">status "reconnecting"</text>
  <path d="M310,543 L326,543" class="ln"/>
  <rect x="326" y="520" width="330" height="46" rx="10" class="box"/>
  <text x="336" y="540" class="s">new ticket -> GET /ws; least_conn picks a replica</text>
  <text x="336" y="558" class="s">backoff + jitter, cap 30 s</text>
  <path d="M656,543 L672,543" class="ln"/>
  <rect x="672" y="520" width="240" height="46" rx="10" class="box"/>
  <text x="682" y="540" class="s">welcome -> resync change feed</text>
  <text x="682" y="558" class="s">-> status "live"</text>

  <text x="30" y="622" class="m">Figure 9.5 - Readiness flips first (compose sees 503); nginx retries failed connections on the other replica; 1001 moves clients over.</text>
</svg>
