<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>One fixture file generated by PostGIS feeds the shared, backend, frontend and end-to-end tests</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#111418"/>
  <text x="480" y="34" text-anchor="middle" fill="#e8ebf0" font-size="20" font-weight="600">Fixtures from PostGIS: one reference file, every layer asserts against it</text>

  <!-- generator -->
  <rect x="210" y="60" width="540" height="72" rx="10" fill="#1b2027" stroke="#8b95a4" stroke-width="1.5"/>
  <text x="480" y="86" text-anchor="middle" fill="#e8ebf0" font-size="15" font-weight="600">PostGIS 3.4 on PostgreSQL 16 (one-off run)</text>
  <text x="480" y="106" text-anchor="middle" fill="#8b95a4" font-size="13">ST_Area(geom::geography) / 1e6, ST_Perimeter, ST_IsValidReason</text>
  <text x="480" y="124" text-anchor="middle" fill="#8b95a4" font-size="12">WGS 84 spheroid a = 6378137, 1/f = 298.257223563</text>

  <line x1="480" y1="132" x2="480" y2="160" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- fixture file -->
  <rect x="210" y="162" width="540" height="136" rx="10" fill="#0d1a1f" stroke="#22d3ee" stroke-width="2"/>
  <text x="480" y="188" text-anchor="middle" fill="#e8ebf0" font-size="15" font-weight="600">docs/fixtures/geodesic-area-fixtures.json</text>
  <text x="480" y="210" text-anchor="middle" fill="#e8ebf0" font-size="13">polygons[]: tel_aviv_1km_square, square_with_hole, ... with</text>
  <text x="480" y="228" text-anchor="middle" fill="#8b95a4" font-size="13">area_km2_spheroid, perimeter_km, geographiclib_area_km2</text>
  <text x="480" y="246" text-anchor="middle" fill="#8b95a4" font-size="13">area_km2_webmercator_planar_WRONG</text>
  <text x="480" y="268" text-anchor="middle" fill="#e8ebf0" font-size="13">invalid_polygons[]: bowtie_self_intersection, unclosed_ring, too_few_points,</text>
  <text x="480" y="286" text-anchor="middle" fill="#8b95a4" font-size="13">duplicate_points_only, spike - each with the GEOS invalid_reason</text>

  <!-- consumers row 1 -->
  <line x1="330" y1="298" x2="130" y2="352" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="298" x2="370" y2="352" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="298" x2="590" y2="352" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="298" x2="830" y2="352" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="356" width="220" height="104" rx="10" fill="#1b2027" stroke="#8b95a4" stroke-width="1.5"/>
  <text x="130" y="378" text-anchor="middle" fill="#e8ebf0" font-size="14" font-weight="600">shared, geodesic.test.ts</text>
  <text x="130" y="398" text-anchor="middle" fill="#8b95a4" font-size="12">geodesicArea <= 1e-6 of spheroid</text>
  <text x="130" y="414" text-anchor="middle" fill="#8b95a4" font-size="12"><= 1e-9 of GeographicLib</text>
  <text x="130" y="430" text-anchor="middle" fill="#8b95a4" font-size="12">Web-Mercator "WRONG" value is</text>
  <text x="130" y="446" text-anchor="middle" fill="#8b95a4" font-size="12">&gt; 30 % off (the classic mistake)</text>

  <rect x="260" y="356" width="220" height="104" rx="10" fill="#1b2027" stroke="#8b95a4" stroke-width="1.5"/>
  <text x="370" y="378" text-anchor="middle" fill="#e8ebf0" font-size="14" font-weight="600">shared, validate.test.ts</text>
  <text x="370" y="398" text-anchor="middle" fill="#8b95a4" font-size="12">every valid fixture -> ok</text>
  <text x="370" y="414" text-anchor="middle" fill="#8b95a4" font-size="12">bowtie -> SELF_INTERSECTION</text>
  <text x="370" y="430" text-anchor="middle" fill="#8b95a4" font-size="12">at [34.785, 32.085] (section 9.3 table)</text>
  <text x="370" y="446" text-anchor="middle" fill="#8b95a4" font-size="12">unclosed_ring -> RING_NOT_CLOSED</text>

  <rect x="480" y="356" width="220" height="104" rx="10" fill="#1b2027" stroke="#8b95a4" stroke-width="1.5"/>
  <text x="590" y="378" text-anchor="middle" fill="#e8ebf0" font-size="14" font-weight="600">shared, schemas.test.ts</text>
  <text x="590" y="398" text-anchor="middle" fill="#8b95a4" font-size="12">every fixture, valid AND invalid,</text>
  <text x="590" y="414" text-anchor="middle" fill="#8b95a4" font-size="12">passes the transport schema</text>
  <text x="590" y="430" text-anchor="middle" fill="#8b95a4" font-size="12">so a domain failure is a 422,</text>
  <text x="590" y="446" text-anchor="middle" fill="#8b95a4" font-size="12">never a 400 (ADR-0002)</text>

  <rect x="720" y="356" width="220" height="104" rx="10" fill="#1b2027" stroke="#8b95a4" stroke-width="1.5"/>
  <text x="830" y="378" text-anchor="middle" fill="#e8ebf0" font-size="14" font-weight="600">frontend, drawingReducer.test</text>
  <text x="830" y="398" text-anchor="middle" fill="#8b95a4" font-size="12">click a fixture's corners:</text>
  <text x="830" y="414" text-anchor="middle" fill="#8b95a4" font-size="12">readout within 1e-6 of</text>
  <text x="830" y="430" text-anchor="middle" fill="#8b95a4" font-size="12">area_km2_spheroid; a second</text>
  <text x="830" y="446" text-anchor="middle" fill="#8b95a4" font-size="12">case: each undo changes it</text>

  <!-- consumers row 2 -->
  <line x1="130" y1="460" x2="130" y2="488" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="460" x2="370" y2="488" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="460" x2="590" y2="488" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="830" y1="460" x2="830" y2="488" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="492" width="220" height="104" rx="10" fill="#1b2027" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="130" y="514" text-anchor="middle" fill="#e8ebf0" font-size="14" font-weight="600">backend, areas-validation.int</text>
  <text x="130" y="534" text-anchor="middle" fill="#8b95a4" font-size="12">POST each invalid fixture -></text>
  <text x="130" y="550" text-anchor="middle" fill="#8b95a4" font-size="12">422 with the section 9.2 sub-code;</text>
  <text x="130" y="566" text-anchor="middle" fill="#8b95a4" font-size="12">the list of names must equal</text>
  <text x="130" y="582" text-anchor="middle" fill="#8b95a4" font-size="12">the file's list (nothing skipped)</text>

  <rect x="260" y="492" width="220" height="104" rx="10" fill="#1b2027" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="370" y="514" text-anchor="middle" fill="#e8ebf0" font-size="14" font-weight="600">backend, areas-rate-limit.int</text>
  <text x="370" y="534" text-anchor="middle" fill="#8b95a4" font-size="12">the bowtie's 422 still costs</text>
  <text x="370" y="550" text-anchor="middle" fill="#8b95a4" font-size="12">one drawing action</text>
  <text x="370" y="566" text-anchor="middle" fill="#8b95a4" font-size="12">(X-Draw-RateLimit-Remaining</text>
  <text x="370" y="582" text-anchor="middle" fill="#8b95a4" font-size="12">drops by one)</text>

  <rect x="480" y="492" width="220" height="104" rx="10" fill="#1b2027" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="590" y="514" text-anchor="middle" fill="#e8ebf0" font-size="14" font-weight="600">backend, migrations.int</text>
  <text x="590" y="534" text-anchor="middle" fill="#8b95a4" font-size="12">the create statement stores the</text>
  <text x="590" y="550" text-anchor="middle" fill="#8b95a4" font-size="12">fixture CCW and its area_km2</text>
  <text x="590" y="566" text-anchor="middle" fill="#8b95a4" font-size="12">equals area_km2_spheroid</text>
  <text x="590" y="582" text-anchor="middle" fill="#8b95a4" font-size="12">(exact match, same formula)</text>

  <rect x="720" y="492" width="220" height="104" rx="10" fill="#1b2027" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="830" y="514" text-anchor="middle" fill="#e8ebf0" font-size="14" font-weight="600">stack, t9-smoke.txt</text>
  <text x="830" y="534" text-anchor="middle" fill="#8b95a4" font-size="12">two browsers draw the fixture:</text>
  <text x="830" y="550" text-anchor="middle" fill="#8b95a4" font-size="12">readout within 5e-3 of the fixture</text>
  <text x="830" y="566" text-anchor="middle" fill="#8b95a4" font-size="12">(pixel quantisation), saved areaKm2</text>
  <text x="830" y="582" text-anchor="middle" fill="#8b95a4" font-size="12">= readout within 1e-9</text>

  <!-- loaders (below both rows, so no arrow crosses it) -->
  <text x="480" y="622" text-anchor="middle" fill="#8b95a4" font-size="12">loaders: packages/shared/src/testing/fixtures.ts, backend/test/helpers/fixtures.ts, frontend imports the JSON directly</text>
</svg>
