<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>The verification ladder (each gate stays green for every later change) and the QA review loop that feeds it</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#111418"/>
  <text x="480" y="34" text-anchor="middle" fill="#e8ebf0" font-size="20" font-weight="600">The gates (SPEC section 12.1, section 12.4, section 12.6) and the QA loop that feeds them</text>

  <!-- ladder -->
  <text x="250" y="66" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="600">Gate ladder - run in this order, each one stays green afterwards</text>

  <rect x="20" y="80" width="460" height="96" rx="10" fill="#1b2027" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="34" y="104" fill="#e8ebf0" font-size="15" font-weight="600">1, npm run verify (no Docker)</text>
  <text x="34" y="124" fill="#8b95a4" font-size="12">lint --max-warnings=0, format:check, typecheck (workspaces + scripts)</text>
  <text x="34" y="140" fill="#8b95a4" font-size="12">test:coverage with thresholds: shared lines >= 90 / branches >= 85;</text>
  <text x="34" y="156" fill="#8b95a4" font-size="12">backend unit set >= 85 / 80 / functions 85; frontend lines >= 70, check:deps (R45)</text>

  <line x1="250" y1="176" x2="250" y2="198" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="200" width="460" height="70" rx="10" fill="#1b2027" stroke="#8b95a4" stroke-width="1.5"/>
  <text x="34" y="224" fill="#e8ebf0" font-size="15" font-weight="600">2, npm run test:integration</text>
  <text x="34" y="244" fill="#8b95a4" font-size="12">docker compose up -d postgres redis redis-cache first;</text>
  <text x="34" y="260" fill="#8b95a4" font-size="12">49 files, one at a time, own database + Redis prefix</text>

  <line x1="250" y1="270" x2="250" y2="292" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="294" width="460" height="70" rx="10" fill="#1b2027" stroke="#8b95a4" stroke-width="1.5"/>
  <text x="34" y="318" fill="#e8ebf0" font-size="15" font-weight="600">3, npm run test:coverage:all -w @snapland/backend</text>
  <text x="34" y="338" fill="#8b95a4" font-size="12">unit + integration projects together (vitest.all.config.ts):</text>
  <text x="34" y="354" fill="#8b95a4" font-size="12">lines >= 80, branches >= 70 over src/** - routes, SQL, Lua, gateway measured here</text>

  <line x1="250" y1="364" x2="250" y2="386" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="388" width="460" height="70" rx="10" fill="#1b2027" stroke="#8b95a4" stroke-width="1.5"/>
  <text x="34" y="412" fill="#e8ebf0" font-size="15" font-weight="600">4, npm run build, docker compose up -d --build</text>
  <text x="34" y="432" fill="#8b95a4" font-size="12">every default service healthy within 120 s; http://localhost:5173 loads;</text>
  <text x="34" y="448" fill="#8b95a4" font-size="12">/docs lists every endpoint; /health/ready ok on both backends</text>

  <line x1="250" y1="458" x2="250" y2="480" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="482" width="460" height="70" rx="10" fill="#1b2027" stroke="#8b95a4" stroke-width="1.5"/>
  <text x="34" y="506" fill="#e8ebf0" font-size="15" font-weight="600">5, E2E stack + npm run test:e2e</text>
  <text x="34" y="526" fill="#8b95a4" font-size="12">docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build</text>
  <text x="34" y="542" fill="#8b95a4" font-size="12">Playwright against nginx; users placed on both backend instances</text>

  <line x1="250" y1="552" x2="250" y2="574" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="576" width="460" height="50" rx="10" fill="#1b2027" stroke="#8b95a4" stroke-width="1.5"/>
  <text x="34" y="598" fill="#e8ebf0" font-size="15" font-weight="600">6, publishable tree</text>
  <text x="34" y="616" fill="#8b95a4" font-size="12">check-publishable.mjs (no .env, no secrets), clean-copy.mjs deleted (plan T2)</text>

  <!-- QA loop -->
  <text x="720" y="66" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="600">QA review loop (.claude/agents/qa-expert.md)</text>

  <rect x="560" y="80" width="320" height="64" rx="10" fill="#1b2027" stroke="#8b95a4" stroke-width="1.5"/>
  <text x="720" y="104" text-anchor="middle" fill="#e8ebf0" font-size="14" font-weight="600">build phase finishes (a task, a wave, a gate)</text>
  <text x="720" y="126" text-anchor="middle" fill="#8b95a4" font-size="12">team-lead integrates; the gates above are run</text>

  <line x1="720" y1="144" x2="720" y2="166" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="560" y="168" width="320" height="86" rx="10" fill="#1b2027" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="720" y="192" text-anchor="middle" fill="#e8ebf0" font-size="14" font-weight="600">qa-expert reviews with evidence</text>
  <text x="720" y="212" text-anchor="middle" fill="#8b95a4" font-size="12">requirement traceability, contract conformance -</text>
  <text x="720" y="228" text-anchor="middle" fill="#8b95a4" font-size="12">domain hot spots, security, code quality</text>
  <text x="720" y="244" text-anchor="middle" fill="#8b95a4" font-size="12">each: severity, file:line, reproduction, expected vs actual</text>

  <line x1="720" y1="254" x2="720" y2="276" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="560" y="278" width="320" height="86" rx="10" fill="#1b2027" stroke="#8b95a4" stroke-width="1.5"/>
  <text x="720" y="302" text-anchor="middle" fill="#e8ebf0" font-size="14" font-weight="600">a regression test named after the finding</text>
  <text x="720" y="322" text-anchor="middle" fill="#8b95a4" font-size="12">qa-login-lockout-race.int.test.ts (T1-QA1-01)</text>
  <text x="720" y="338" text-anchor="middle" fill="#8b95a4" font-size="12">Workspace.offlineBlip.qa.test.ts (T5 review round 1)</text>
  <text x="720" y="354" text-anchor="middle" fill="#8b95a4" font-size="12">areas-concurrency "409, not 404 (T9)" - SPEC section 19.2 F1</text>

  <line x1="720" y1="364" x2="720" y2="386" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="560" y="388" width="320" height="64" rx="10" fill="#1b2027" stroke="#8b95a4" stroke-width="1.5"/>
  <text x="720" y="412" text-anchor="middle" fill="#e8ebf0" font-size="14" font-weight="600">the fix lands (code, or the SPEC, deliberately)</text>
  <text x="720" y="434" text-anchor="middle" fill="#8b95a4" font-size="12">never both drifting: "fix one of them deliberately"</text>

  <line x1="720" y1="452" x2="720" y2="474" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="560" y="476" width="320" height="64" rx="10" fill="#1b2027" stroke="#8b95a4" stroke-width="1.5"/>
  <text x="720" y="500" text-anchor="middle" fill="#e8ebf0" font-size="14" font-weight="600">gates re-run; green stays green</text>
  <text x="720" y="522" text-anchor="middle" fill="#8b95a4" font-size="12">the test now guards the seam for every later change</text>

  <!-- loop back arrow -->
  <path d="M 880 508 C 930 508, 930 112, 882 112" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="940" y="316" text-anchor="middle" fill="#8b95a4" font-size="11" transform="rotate(90 940 316)">next phase</text>

  <rect x="560" y="560" width="380" height="66" rx="10" fill="#0d1a1f" stroke="#22d3ee" stroke-width="1"/>
  <text x="750" y="584" text-anchor="middle" fill="#e8ebf0" font-size="13" font-weight="600">Ground rule (simplify plan section 2.5)</text>
  <text x="750" y="606" text-anchor="middle" fill="#8b95a4" font-size="12">"Never delete a test that proves a graded bullet unless the step</text>
  <text x="750" y="620" text-anchor="middle" fill="#8b95a4" font-size="12">names the test that replaces the proof."</text>
</svg>
