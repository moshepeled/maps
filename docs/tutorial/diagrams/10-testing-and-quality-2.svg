<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" font-family="system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>One integration run: a private database cloned from a migrated template, a private Redis key prefix, and teardown</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="960" height="800" fill="#111418"/>
  <text x="480" y="34" text-anchor="middle" fill="#e8ebf0" font-size="20" font-weight="600">One integration run gets its own database and its own Redis keys</text>

  <!-- compose services (right column) -->
  <rect x="700" y="70" width="240" height="250" rx="10" fill="#161b22" stroke="#8b95a4" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="820" y="90" text-anchor="middle" fill="#8b95a4" font-size="13">shared compose services</text>
  <text x="820" y="106" text-anchor="middle" fill="#8b95a4" font-size="13">(never stopped by tests)</text>
  <rect x="710" y="120" width="220" height="56" rx="8" fill="#1b2027" stroke="#8b95a4"/>
  <text x="820" y="144" text-anchor="middle" fill="#e8ebf0" font-size="14" font-weight="600">postgres (PostGIS 3.5)</text>
  <text x="820" y="164" text-anchor="middle" fill="#8b95a4" font-size="12">127.0.0.1:55432, admin db "postgres"</text>
  <rect x="710" y="188" width="220" height="56" rx="8" fill="#1b2027" stroke="#8b95a4"/>
  <text x="820" y="212" text-anchor="middle" fill="#e8ebf0" font-size="14" font-weight="600">redis (critical)</text>
  <text x="820" y="232" text-anchor="middle" fill="#8b95a4" font-size="12">127.0.0.1:56379, db index 1</text>
  <rect x="710" y="256" width="220" height="56" rx="8" fill="#1b2027" stroke="#8b95a4"/>
  <text x="820" y="280" text-anchor="middle" fill="#e8ebf0" font-size="14" font-weight="600">redis-cache</text>
  <text x="820" y="300" text-anchor="middle" fill="#8b95a4" font-size="12">127.0.0.1:56380, db index 1</text>

  <!-- step 1 -->
  <rect x="20" y="70" width="300" height="70" rx="10" fill="#1b2027" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="170" y="96" text-anchor="middle" fill="#e8ebf0" font-size="15" font-weight="600">1, global-setup.ts (main process)</text>
  <text x="170" y="118" text-anchor="middle" fill="#8b95a4" font-size="13">runId = base36(Date.now()) + base36(pid)</text>
  <text x="170" y="134" text-anchor="middle" fill="#8b95a4" font-size="12">e.g. "mg7a1k2e5b" (<= 12 chars, asserted)</text>

  <!-- step 2 template -->
  <line x1="170" y1="140" x2="170" y2="166" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="168" width="300" height="86" rx="10" fill="#1b2027" stroke="#8b95a4" stroke-width="1.5"/>
  <text x="170" y="192" text-anchor="middle" fill="#e8ebf0" font-size="15" font-weight="600">2, template, built once</text>
  <text x="170" y="212" text-anchor="middle" fill="#8b95a4" font-size="13">snapland_it_tpl_&lt;sha256 of migrations&gt;</text>
  <text x="170" y="230" text-anchor="middle" fill="#8b95a4" font-size="12">runMigrations(up), ALTER ... IS_TEMPLATE true</text>
  <text x="170" y="246" text-anchor="middle" fill="#8b95a4" font-size="12">under pg_advisory_lock(7210099) on the admin db</text>

  <!-- step 3 clone -->
  <line x1="170" y1="254" x2="170" y2="280" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="282" width="300" height="70" rx="10" fill="#1b2027" stroke="#8b95a4" stroke-width="1.5"/>
  <text x="170" y="306" text-anchor="middle" fill="#e8ebf0" font-size="15" font-weight="600">3, clone for this run (fast)</text>
  <text x="170" y="326" text-anchor="middle" fill="#8b95a4" font-size="13">CREATE DATABASE snapland_it_&lt;runId&gt;</text>
  <text x="170" y="343" text-anchor="middle" fill="#8b95a4" font-size="13">TEMPLATE snapland_it_tpl_...</text>

  <!-- step 3b redis prefix -->
  <rect x="360" y="282" width="300" height="70" rx="10" fill="#1b2027" stroke="#8b95a4" stroke-width="1.5"/>
  <text x="510" y="306" text-anchor="middle" fill="#e8ebf0" font-size="15" font-weight="600">3, Redis key prefix for this run</text>
  <text x="510" y="326" text-anchor="middle" fill="#8b95a4" font-size="13">REDIS_KEY_PREFIX = snaptest&lt;runId&gt;:</text>
  <text x="510" y="343" text-anchor="middle" fill="#8b95a4" font-size="13">crashed runs' prefixes (&gt; 6 h) unlinked</text>
  <line x1="320" y1="317" x2="358" y2="317" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="317" x2="708" y2="216" stroke="#8b95a4" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="660" y1="317" x2="708" y2="284" stroke="#8b95a4" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="320" y1="300" x2="708" y2="148" stroke="#8b95a4" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- step 4 provide -->
  <line x1="170" y1="352" x2="170" y2="378" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="380" width="640" height="112" rx="10" fill="#1b2027" stroke="#8b95a4" stroke-width="1.5"/>
  <text x="340" y="404" text-anchor="middle" fill="#e8ebf0" font-size="15" font-weight="600">4, provide('snaplandTestEnv', ...) -> every worker runs test/setup/env.ts</text>
  <text x="340" y="426" text-anchor="middle" fill="#8b95a4" font-size="13">DATABASE_URL, REDIS_URL, CACHE_REDIS_URL, REDIS_KEY_PREFIX, JWT_SECRET</text>
  <text x="340" y="444" text-anchor="middle" fill="#8b95a4" font-size="13">generic limits = 100000, RETENTION_ENABLED = false</text>
  <text x="340" y="464" text-anchor="middle" fill="#8b95a4" font-size="13">env.ts first deletes every CONFIG_KEYS entry inherited from the shell,</text>
  <text x="340" y="482" text-anchor="middle" fill="#8b95a4" font-size="13">so a developer's .env can never change a test outcome</text>

  <!-- step 5 test app -->
  <line x1="340" y1="492" x2="340" y2="516" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="518" width="640" height="132" rx="10" fill="#1b2027" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="340" y="542" text-anchor="middle" fill="#e8ebf0" font-size="15" font-weight="600">5, in each *.int.test.ts: createTestApp({ config, overrides, routes })</text>
  <text x="340" y="564" text-anchor="middle" fill="#8b95a4" font-size="13">files run one at a time (fileParallelism: false), instanceId "&lt;runId&gt;-&lt;n&gt;"</text>
  <text x="340" y="582" text-anchor="middle" fill="#8b95a4" font-size="13">loadConfig(process.env + per-test config) -> createContainer -> buildApp -> ready -> start</text>
  <text x="340" y="600" text-anchor="middle" fill="#8b95a4" font-size="13">requests via app.inject(), WebSocket tests via listen({ port: 0 }), logs captured</text>
  <text x="340" y="618" text-anchor="middle" fill="#8b95a4" font-size="13">outages: createTcpProxy(target).pause() / stall() in front of Redis or PostgreSQL,</text>
  <text x="340" y="636" text-anchor="middle" fill="#8b95a4" font-size="13">never a stopped container</text>

  <!-- teardown -->
  <line x1="340" y1="650" x2="340" y2="674" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="676" width="640" height="96" rx="10" fill="#1b2027" stroke="#8b95a4" stroke-width="1.5"/>
  <text x="340" y="700" text-anchor="middle" fill="#e8ebf0" font-size="15" font-weight="600">6, teardown (global setup's returned function)</text>
  <text x="340" y="722" text-anchor="middle" fill="#8b95a4" font-size="13">DROP DATABASE snapland_it_&lt;runId&gt; WITH (FORCE)</text>
  <text x="340" y="740" text-anchor="middle" fill="#8b95a4" font-size="13">SCAN + UNLINK snaptest&lt;runId&gt;:* on both Redis roles</text>
  <text x="340" y="758" text-anchor="middle" fill="#8b95a4" font-size="13">two engineers or two parallel tasks running at once never share rows or keys</text>

  <!-- isolation rules -->
  <rect x="700" y="380" width="240" height="392" rx="10" fill="#0d1a1f" stroke="#22d3ee" stroke-width="1"/>
  <text x="820" y="406" text-anchor="middle" fill="#e8ebf0" font-size="14" font-weight="600">Isolation rules (SPEC section 12.2)</text>
  <text x="712" y="432" fill="#e8ebf0" font-size="13">1. per-IP limit tests use</text>
  <text x="712" y="450" fill="#8b95a4" font-size="13">   uniqueIp() = 10.&lt;runId hash&gt;.x.y</text>
  <text x="712" y="478" fill="#e8ebf0" font-size="13">2. CLIENT KILL only on names</text>
  <text x="712" y="496" fill="#8b95a4" font-size="13">   that contain this runId</text>
  <text x="712" y="524" fill="#e8ebf0" font-size="13">3. WS clients always send an</text>
  <text x="712" y="542" fill="#8b95a4" font-size="13">   allowed Origin + snapland.v1</text>
  <text x="712" y="570" fill="#e8ebf0" font-size="13">4. timing: sub-second REALTIME_*</text>
  <text x="712" y="588" fill="#8b95a4" font-size="13">   knobs, not fake timers (Redis</text>
  <text x="712" y="606" fill="#8b95a4" font-size="13">   TTLs cannot be faked)</text>
  <text x="712" y="634" fill="#e8ebf0" font-size="13">5. waitFor(probe) polls every</text>
  <text x="712" y="652" fill="#8b95a4" font-size="13">   25 ms against a monotonic</text>
  <text x="712" y="670" fill="#8b95a4" font-size="13">   deadline (performance.now());</text>
  <text x="712" y="688" fill="#8b95a4" font-size="13">   no fixed sleeps</text>
</svg>
