<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="t4 d4">
  <title id="t4">How nginx routes each request path</title>
  <desc id="d4">Seven request families on the left map to location rules in the middle and to one of three destinations on the right: the static SPA files, the snapland_backend upstream with two replicas, or nginx itself for /healthz and generated problem+json errors.</desc>
  <defs>
    <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #e8ebf0; font-size: 15px; }
      .h { font-size: 20px; font-weight: 600; }
      .b { font-weight: 600; }
      .m { fill: #8b95a4; font-size: 14px; }
      .s { fill: #8b95a4; font-size: 13px; }
      .a { fill: #22d3ee; }
      .box { fill: #1a1f26; stroke: #3a4250; stroke-width: 1.5; }
      .acc { stroke: #22d3ee; }
      .ln { stroke: #22d3ee; stroke-width: 2; fill: none; marker-end: url(#ar4); }
    </style>
  </defs>
  <rect width="960" height="620" fill="#111418"/>
  <text x="30" y="40" class="h">nginx.conf: every request path has exactly one home</text>
  <text x="30" y="72" class="m">Request</text>
  <text x="310" y="72" class="m">Location rule (docker/nginx/nginx.conf + snippets/)</text>
  <text x="700" y="72" class="m">Destination</text>

  <!-- Row 1 -->
  <rect x="30" y="84" width="250" height="52" rx="10" class="box"/>
  <text x="42" y="106" class="b">/   /signin   /assets/app-x.js</text>
  <text x="42" y="126" class="s">client routes and hashed bundles</text>
  <rect x="310" y="84" width="360" height="52" rx="10" class="box"/>
  <text x="322" y="106" class="s">try_files $uri /index.html, assets immutable 1 y</text>
  <text x="322" y="126" class="s">index.html no-cache, CSP headers, gzip_static</text>
  <path d="M670,110 L700,110" class="ln"/>

  <!-- Row 2 -->
  <rect x="30" y="152" width="250" height="52" rx="10" class="box"/>
  <text x="42" y="174" class="b">/api/**</text>
  <text x="42" y="194" class="s">the REST API (JSON)</text>
  <rect x="310" y="152" width="360" height="52" rx="10" class="box"/>
  <text x="322" y="174" class="s">proxy-backend.conf: keepalive, 30 s read timeout</text>
  <text x="322" y="194" class="s">retry error/timeout/502, 2 tries, never a POST</text>
  <path d="M670,178 L700,190" class="ln"/>

  <!-- Row 3 -->
  <rect x="30" y="220" width="250" height="52" rx="10" class="box"/>
  <text x="42" y="242" class="b">/api/v1/auth/**</text>
  <text x="42" y="262" class="s">sign-in, refresh, ws-ticket</text>
  <rect x="310" y="220" width="360" height="52" rx="10" class="box"/>
  <text x="322" y="242" class="s">same proxy rules, plus gzip off</text>
  <text x="322" y="262" class="s">(no length oracle on token responses)</text>
  <path d="M670,246 L700,240" class="ln"/>

  <!-- Row 4 -->
  <rect x="30" y="288" width="250" height="52" rx="10" class="box"/>
  <text x="42" y="310" class="b">/docs   /health/**</text>
  <text x="42" y="330" class="s">OpenAPI UI, readiness</text>
  <rect x="310" y="288" width="360" height="52" rx="10" class="box"/>
  <text x="322" y="310" class="s">^~ prefix locations, same proxy-backend.conf</text>
  <text x="322" y="330" class="s">/health/: whichever replica answers</text>
  <path d="M670,314 L700,290" class="ln"/>

  <!-- Row 5 -->
  <rect x="30" y="356" width="250" height="52" rx="10" class="box"/>
  <text x="42" y="378" class="b">/ws?ticket=...</text>
  <text x="42" y="398" class="s">WebSocket snapland.v1</text>
  <rect x="310" y="356" width="360" height="52" rx="10" class="box"/>
  <text x="322" y="378" class="s">Upgrade + Connection headers, 75 s read/send</text>
  <text x="322" y="398" class="s">error_log off (ticket in the query string)</text>
  <path d="M670,382 L700,340" class="ln"/>

  <!-- Row 6 -->
  <rect x="30" y="424" width="250" height="52" rx="10" class="box"/>
  <text x="42" y="446" class="b">/healthz</text>
  <text x="42" y="466" class="s">edge liveness</text>
  <rect x="310" y="424" width="360" height="52" rx="10" class="box"/>
  <text x="322" y="446" class="s">return 200 "ok" (compose healthcheck)</text>
  <text x="322" y="466" class="s">no /metrics location: replica metrics stay internal</text>
  <path d="M670,450 L700,470" class="ln"/>

  <!-- Row 7 -->
  <rect x="30" y="492" width="250" height="52" rx="10" class="box"/>
  <text x="42" y="514" class="b">big body, no replica, timeout</text>
  <text x="42" y="534" class="s">errors nginx meets before a backend</text>
  <rect x="310" y="492" width="360" height="52" rx="10" class="box"/>
  <text x="322" y="514" class="s">error_page -> @problem_* named locations</text>
  <text x="322" y="534" class="s">problem+json 413 / 503 + Retry-After + X-Request-Id</text>
  <path d="M670,518 L700,500" class="ln"/>

  <!-- Destinations -->
  <rect x="700" y="84" width="230" height="52" rx="10" class="box"/>
  <text x="712" y="106" class="b">SPA files</text>
  <text x="712" y="126" class="s">html root: /usr/share/nginx/html</text>

  <rect x="700" y="152" width="230" height="240" rx="10" class="box acc"/>
  <text x="712" y="176" class="b">upstream <tspan class="a">snapland_backend</tspan></text>
  <text x="712" y="200" class="s">least_conn, zone, keepalive 32</text>
  <text x="712" y="222" class="s">server backend-1:3100 resolve</text>
  <text x="712" y="244" class="s">server backend-2:3100 resolve</text>
  <text x="712" y="266" class="s">max_fails=3 fail_timeout=10s</text>
  <text x="712" y="288" class="s">proxy_connect_timeout 1s</text>
  <text x="712" y="310" class="s">resolver 127.0.0.11 valid=10s</text>
  <text x="712" y="340" class="s">X-Forwarded-For = $remote_addr</text>
  <text x="712" y="362" class="s">X-Request-Id = validated or new</text>

  <rect x="700" y="424" width="230" height="120" rx="10" class="box"/>
  <text x="712" y="448" class="b">nginx answers itself</text>
  <text x="712" y="472" class="s">no upstream call, no backend cost</text>
  <text x="712" y="494" class="s">access log shows upstream=-</text>
  <text x="712" y="516" class="s">problem bodies match the backend</text>
  <text x="712" y="538" class="s">contract (SPEC section 3.5)</text>

  <text x="30" y="600" class="m">Figure 9.4 - The edge decides, per path, between static files, the two replicas, or a local answer.</text>
</svg>
