<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t2 d2">
  <title id="t2">From a viewport to a page: the R-tree first, the exact test second</title>
  <desc id="d2">Left: a map with polygon bounding boxes; the viewport envelope overlaps some boxes (candidates), misses others, and a tombstone is not in the partial index at all. Right: the four steps of the bbox statement: GiST candidate search, ST_Intersects exact filter, sub-pixel culling, keyset page with the position budget.</desc>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#111418"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e8ebf0">
    <text x="480" y="36" font-size="20" text-anchor="middle" font-weight="600">From a viewport to a page: R-tree first, exact test second</text>

    <!-- map panel -->
    <rect x="30" y="60" width="430" height="416" rx="10" fill="#161b22" stroke="#2c333d"/>
    <text x="245" y="84" font-size="12" text-anchor="middle" fill="#8b95a4">areas_geom_live_gist: one bounding box per live polygon</text>

    <!-- viewport envelope -->
    <rect x="150" y="170" width="210" height="150" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="320" y="336" font-size="11" text-anchor="end" fill="#22d3ee">ST_MakeEnvelope(west, south, east, north, 4326)</text>

    <!-- candidates (accent) -->
    <rect x="120" y="120" width="90" height="70" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
    <path d="M128,182 L160,126 L202,146 L192,186 L146,180 Z" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee"/>
    <text x="112" y="132" font-size="13" text-anchor="end" fill="#22d3ee">A OK</text>

    <rect x="260" y="200" width="110" height="80" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
    <path d="M268,272 L290,208 L340,205 L364,250 L330,276 Z" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee"/>
    <text x="378" y="212" font-size="13" fill="#22d3ee">B OK</text>

    <rect x="330" y="290" width="90" height="60" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
    <path d="M338,342 L350,298 L410,300 L414,345 Z" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee"/>
    <text x="428" y="346" font-size="13" fill="#22d3ee">C OK</text>

    <!-- tiny polygon: candidate but culled at low zoom -->
    <rect x="165" y="290" width="22" height="16" fill="#22d3ee" fill-opacity="0.35" stroke="#22d3ee" stroke-width="1"/>
    <text x="192" y="302" font-size="12" fill="#8b95a4">F: &lt; 2 px -> culled</text>

    <!-- rejected by the R-tree (muted) -->
    <rect x="60" y="346" width="80" height="60" fill="none" stroke="#8b95a4" stroke-width="1.2"/>
    <path d="M68,400 L80,354 L130,351 L134,400 Z" fill="#8b95a4" fill-opacity="0.12" stroke="#8b95a4"/>
    <text x="100" y="424" font-size="12" text-anchor="middle" fill="#8b95a4">D x box misses</text>

    <rect x="380" y="90" width="60" height="50" fill="none" stroke="#8b95a4" stroke-width="1.2"/>
    <path d="M388,134 L398,96 L434,100 L430,136 Z" fill="#8b95a4" fill-opacity="0.12" stroke="#8b95a4"/>
    <text x="410" y="156" font-size="12" text-anchor="middle" fill="#8b95a4">E x</text>

    <!-- tombstone: overlaps the viewport but is not in the partial index -->
    <rect x="85" y="215" width="75" height="55" fill="none" stroke="#8b95a4" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M92,264 L100,222 L150,224 L152,264 Z" fill="none" stroke="#8b95a4" stroke-dasharray="3 3"/>
    <text x="36" y="288" font-size="12" fill="#8b95a4">T: tombstone</text>
    <text x="36" y="302" font-size="12" fill="#8b95a4">(deleted_at set),</text>
    <text x="36" y="316" font-size="12" fill="#8b95a4">never in the index</text>

    <!-- legend -->
    <text x="45" y="440" font-size="11" fill="#8b95a4">cyan = candidate found by the index, grey = rejected by the R-tree</text>
    <text x="45" y="454" font-size="11" fill="#8b95a4">dashed = tombstone: a soft-deleted row (deleted_at set),</text>
    <text x="45" y="468" font-size="11" fill="#8b95a4">excluded by the partial index predicate WHERE deleted_at IS NULL</text>

    <!-- steps panel -->
    <rect x="490" y="60" width="440" height="78" rx="10" fill="#1a1f26" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="505" y="84" font-size="15" font-weight="600">1, Index: areas_geom_live_gist (GiST R-tree)</text>
    <text x="505" y="106" font-size="12" fill="#8b95a4">geom &amp;&amp; envelope: boxes only, O(log n + k), no table scan</text>
    <text x="505" y="126" font-size="12" fill="#8b95a4">partial: WHERE deleted_at IS NULL - tombstones never enter</text>
    <line x1="710" y1="138" x2="710" y2="156" stroke="#22d3ee" stroke-width="2" marker-end="url(#a2)"/>

    <rect x="490" y="158" width="440" height="66" rx="10" fill="#1a1f26" stroke="#2c333d"/>
    <text x="505" y="182" font-size="15" font-weight="600">2, Exact filter: ST_Intersects(geom, envelope)</text>
    <text x="505" y="206" font-size="12" fill="#8b95a4">the real polygon vs the rectangle; touching counts (closed)</text>
    <line x1="710" y1="224" x2="710" y2="242" stroke="#22d3ee" stroke-width="2" marker-end="url(#a2)"/>

    <rect x="490" y="244" width="440" height="66" rx="10" fill="#1a1f26" stroke="#2c333d"/>
    <text x="505" y="268" font-size="15" font-weight="600">3, Culling: bbox_extent_deg >= minExtentDeg</text>
    <text x="505" y="292" font-size="12" fill="#8b95a4">zoom <= 14 only; omissions counted (culledCount), never silent</text>
    <line x1="710" y1="310" x2="710" y2="328" stroke="#22d3ee" stroke-width="2" marker-end="url(#a2)"/>

    <rect x="490" y="330" width="440" height="78" rx="10" fill="#1a1f26" stroke="#2c333d"/>
    <text x="505" y="354" font-size="15" font-weight="600">4, Keyset page: id &gt; cursor ORDER BY id LIMIT n + 1</text>
    <text x="505" y="376" font-size="12" fill="#8b95a4">running sum(vertex_count) vs the 150,000-position budget;</text>
    <text x="505" y="396" font-size="12" fill="#8b95a4">GeoJSON only for rows inside the budget (+ one sentinel)</text>

    <rect x="490" y="420" width="440" height="40" rx="10" fill="#161b22" stroke="#2c333d"/>
    <text x="710" y="445" font-size="12" text-anchor="middle" fill="#22d3ee">Rule: without a literal a.deleted_at IS NULL, step 1 cannot run.</text>

    <text x="480" y="515" font-size="14" text-anchor="middle" fill="#8b95a4">Figure 2 - The R-tree narrows 10,000+ rows to overlapping boxes; the exact test and page rules run only on those.</text>
  </g>
</svg>
