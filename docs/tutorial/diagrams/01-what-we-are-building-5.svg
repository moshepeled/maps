<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t5 d5">
  <title id="t5">The workspace modes you meet in the tour</title>
  <desc id="d5">A simplified state machine: Browse to Drawing to Naming to SavingNew to AreaSelected, then AreaSelected to EditingShape to SavingEdit and back, with a dashed branch to ResolvingConflict. Dashed edges return to Browse from Drawing (Esc or Cancel) and from AreaSelected (Esc, close or click empty map).</desc>
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b95a4"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #e8ebf0; }
    .title { font-size: 20px; font-weight: 600; }
    .state { font-size: 14px; font-weight: 600; text-anchor: middle; }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; fill: #22d3ee; text-anchor: middle; }
    .small { font-size: 13px; fill: #8b95a4; }
    .edge { font-size: 13px; fill: #8b95a4; text-anchor: middle; }
    .box { fill: #181c22; stroke: #5c6676; stroke-width: 1.5; rx: 10; }
    .start { fill: #181c22; stroke: #22d3ee; stroke-width: 2; rx: 10; }
    .flow { stroke: #22d3ee; stroke-width: 2; fill: none; }
    .back { stroke: #8b95a4; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  </style>
  <rect width="960" height="470" fill="#111418"/>

  <!-- Boxes first, so no later shape paints over a label -->
  <!-- Row 1: y 96-156 -->
  <rect x="32" y="96" width="150" height="60" class="start"/>
  <rect x="280" y="96" width="150" height="60" class="box"/>
  <rect x="528" y="96" width="150" height="60" class="box"/>
  <rect x="776" y="96" width="150" height="60" class="box"/>
  <!-- Row 2: y 236-296 -->
  <rect x="32" y="236" width="150" height="60" class="box"/>
  <rect x="280" y="236" width="150" height="60" class="box"/>
  <rect x="528" y="236" width="150" height="60" class="box"/>
  <rect x="776" y="236" width="150" height="60" class="box"/>

  <!-- Edges -->
  <!-- Row 1, left to right -->
  <path d="M182,126 L278,126" class="flow" marker-end="url(#a5)"/>
  <path d="M430,126 L526,126" class="flow" marker-end="url(#a5)"/>
  <path d="M678,126 L774,126" class="flow" marker-end="url(#a5)"/>
  <!-- SavingNew down to AreaSelected -->
  <path d="M851,156 L851,234" class="flow" marker-end="url(#a5)"/>
  <!-- Row 2, right to left -->
  <path d="M776,266 L680,266" class="flow" marker-end="url(#a5)"/>
  <path d="M528,266 L432,266" class="flow" marker-end="url(#a5)"/>
  <path d="M280,266 L184,266" class="back" marker-end="url(#m5)"/>
  <!-- Drawing back to Browse: lands on Browse's bottom edge -->
  <path d="M330,156 C330,200 120,200 112,158" class="back" marker-end="url(#m5)"/>
  <!-- SavingEdit back to AreaSelected: under row 2 -->
  <path d="M355,296 C355,350 851,350 851,298" class="back" marker-end="url(#m5)"/>
  <!-- AreaSelected back to Browse: around the top, lands on Browse's top edge -->
  <path d="M926,266 L944,266 L944,72 L107,72 L107,94" class="back" marker-end="url(#m5)"/>

  <!-- Text last -->
  <text x="32" y="40" class="title">The workspace modes you meet in the tour (simplified)</text>
  <text x="520" y="64" class="edge">Esc, close or click empty map -> back to Browse</text>

  <text x="107" y="120" class="state">Browse</text>
  <text x="107" y="140" class="mono">data-mode="browse"</text>
  <text x="355" y="120" class="state">Drawing</text>
  <text x="355" y="140" class="mono">"drawing"</text>
  <text x="603" y="120" class="state">Naming</text>
  <text x="603" y="140" class="mono">"naming"</text>
  <text x="851" y="120" class="state">SavingNew</text>
  <text x="851" y="140" class="mono">"saving-new"</text>

  <text x="230" y="118" class="edge">D / Draw</text>
  <text x="478" y="118" class="edge">Finish</text>
  <text x="726" y="118" class="edge">Save area</text>

  <text x="140" y="208" class="small">Esc or Cancel (Undo toast)</text>
  <text x="862" y="200" class="small">created (201)</text>

  <text x="107" y="260" class="state">ResolvingConflict</text>
  <text x="107" y="280" class="mono">"resolving-conflict"</text>
  <text x="355" y="260" class="state">SavingEdit</text>
  <text x="355" y="280" class="mono">"saving-edit"</text>
  <text x="603" y="260" class="state">EditingShape</text>
  <text x="603" y="280" class="mono">"editing-shape"</text>
  <text x="851" y="260" class="state">AreaSelected</text>
  <text x="851" y="280" class="mono">"area-selected"</text>

  <text x="727" y="258" class="edge">E / Edit</text>
  <text x="479" y="258" class="edge">Save changes</text>
  <text x="231" y="258" class="edge">409</text>
  <text x="34" y="318" class="small">someone saved first (409)</text>
  <text x="603" y="354" class="edge">saved (auto-merge included) -> back to AreaSelected</text>

  <line x1="32" y1="380" x2="928" y2="380" stroke="#5c6676"/>
  <text x="32" y="406" class="small">Caption: exactly one mode is active, and it decides what a map click does. The map element carries the mode in its</text>
  <text x="32" y="426" class="small">data-mode attribute, which the E2E tests read. The full machine (10 modes, incl. PreviewingVersion and DeletedWhileEditing)</text>
  <text x="32" y="446" class="small">is in docs/design/UX.md section 3.4; Chapters 7 and 8 walk through the reducers that implement it.</text>
</svg>
