<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <title>Interest management: viewport, interest region (+50 %), and which events reach the socket</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="960" height="590" fill="#111418"/>
  <text x="480" y="34" text-anchor="middle" fill="#e8ebf0" font-size="18" font-weight="600">Interest management: a socket receives only what intersects viewport + 50 %</text>

  <!-- map area -->
  <rect x="40" y="60" width="600" height="490" rx="10" fill="#0d1116" stroke="#2a313b"/>

  <!-- interest region: viewport 240x160 at (220,200); margin 50% of width/height each side → 480x320 at (100,120) -->
  <rect x="100" y="120" width="480" height="320" rx="8" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="110" y="140" fill="#22d3ee">interest = viewport expanded by 50 % of its width</text>
  <text x="110" y="158" fill="#22d3ee">and height on each side (interestOf)</text>

  <!-- viewport -->
  <rect x="220" y="200" width="240" height="160" rx="6" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-width="2"/>
  <text x="340" y="284" text-anchor="middle" fill="#e8ebf0" font-size="15" font-weight="600">viewport (viewport.set bbox)</text>
  <text x="340" y="304" text-anchor="middle" fill="#8b95a4">sent on moveend</text>

  <!-- event A: draft inside interest but outside viewport → delivered -->
  <rect x="490" y="150" width="70" height="40" rx="4" fill="#34d399" fill-opacity="0.25" stroke="#34d399" stroke-width="1.5"/>
  <text x="525" y="175" text-anchor="middle" fill="#e8ebf0" font-size="13">A</text>

  <!-- event B: entirely left of the interest region (x 45–90 vs interest x ≥ 100) → not delivered -->
  <rect x="45" y="452" width="45" height="50" rx="4" fill="#f87171" fill-opacity="0.2" stroke="#f87171" stroke-width="1.5"/>
  <text x="67" y="482" text-anchor="middle" fill="#e8ebf0" font-size="13">B</text>

  <!-- event C: area moved out: prev bbox inside interest, new bbox entirely left of it -->
  <rect x="140" y="330" width="60" height="40" rx="4" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="170" y="355" text-anchor="middle" fill="#8b95a4" font-size="13">C prev</text>
  <rect x="45" y="230" width="45" height="40" rx="4" fill="#fbbf24" fill-opacity="0.25" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="67" y="255" text-anchor="middle" fill="#e8ebf0" font-size="12">C new</text>
  <line x1="140" y1="350" x2="92" y2="262" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="660" y="60" width="290" height="490" rx="10" fill="#161b22" stroke="#2a313b"/>
  <text x="805" y="88" text-anchor="middle" fill="#e8ebf0" font-size="15" font-weight="600">Does this socket get the event?</text>

  <rect x="674" y="108" width="18" height="18" rx="3" fill="#34d399" fill-opacity="0.25" stroke="#34d399"/>
  <text x="702" y="122" fill="#e8ebf0" font-weight="600">A  draft.updated - yes</text>
  <text x="674" y="142" fill="#8b95a4">draft bbox (vertices + cursor) meets</text>
  <text x="674" y="160" fill="#8b95a4">the interest: a small pan needs no</text>
  <text x="674" y="178" fill="#8b95a4">refetch. Never sent to its author.</text>

  <rect x="674" y="204" width="18" height="18" rx="3" fill="#f87171" fill-opacity="0.2" stroke="#f87171"/>
  <text x="702" y="218" fill="#e8ebf0" font-weight="600">B  area.changed far away - no</text>
  <text x="674" y="238" fill="#8b95a4">intersectsInterest() is false; the</text>
  <text x="674" y="256" fill="#8b95a4">change is still in the change feed.</text>

  <rect x="674" y="282" width="18" height="18" rx="3" fill="#fbbf24" fill-opacity="0.25" stroke="#fbbf24"/>
  <text x="702" y="296" fill="#e8ebf0" font-weight="600">C  area moved out - yes</text>
  <text x="674" y="316" fill="#8b95a4">targets = [area.bbox, prevBbox]:</text>
  <text x="674" y="334" fill="#8b95a4">a viewer of the OLD place must</text>
  <text x="674" y="352" fill="#8b95a4">learn that it left.</text>

  <text x="674" y="388" fill="#e8ebf0" font-weight="600">No viewport yet?</text>
  <text x="674" y="408" fill="#8b95a4">interest is null -> no spatial events</text>
  <text x="674" y="426" fill="#8b95a4">at all (presence still arrives:</text>
  <text x="674" y="444" fill="#8b95a4">it is global).</text>

  <text x="674" y="478" fill="#e8ebf0" font-weight="600">Cost</text>
  <text x="674" y="498" fill="#8b95a4">linear scan of local connections,</text>
  <text x="674" y="516" fill="#8b95a4">~ 4 comparisons each (an R-tree is</text>
  <text x="674" y="534" fill="#8b95a4">the documented upgrade).</text>

  <text x="480" y="576" text-anchor="middle" fill="#8b95a4" font-size="13">Sources: backend/src/modules/realtime/interest.ts, fanout.ts (#onArea, #onDraft), dispatch.ts (viewport.set)</text>
</svg>
