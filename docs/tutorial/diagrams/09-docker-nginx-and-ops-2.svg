<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t2 d2">
  <title id="t2">The six stages of backend/Dockerfile</title>
  <desc id="d2">base feeds manifests; manifests feeds deps and prod-deps; deps feeds build; build and prod-deps are copied into a fresh runtime stage that contains tini, production dependencies, compiled JavaScript and migrations, and runs as the node user.</desc>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #e8ebf0; font-size: 15px; }
      .h { font-size: 20px; font-weight: 600; }
      .b { font-weight: 600; }
      .m { fill: #8b95a4; font-size: 14px; }
      .a { fill: #22d3ee; }
      .box { fill: #1a1f26; stroke: #3a4250; stroke-width: 1.5; }
      .acc { stroke: #22d3ee; }
      .ln { stroke: #22d3ee; stroke-width: 2; fill: none; marker-end: url(#ar2); }
    </style>
  </defs>
  <rect width="960" height="540" fill="#111418"/>
  <text x="30" y="42" class="h">backend/Dockerfile: six stages, one small runtime image</text>

  <!-- base -->
  <rect x="30" y="80" width="200" height="70" rx="10" class="box"/>
  <text x="45" y="106" class="b">base</text>
  <text x="45" y="128" class="m">node:22.23.3-alpine3.23</text>

  <!-- manifests -->
  <rect x="30" y="220" width="215" height="90" rx="10" class="box"/>
  <text x="45" y="246" class="b">manifests</text>
  <text x="45" y="268" class="m">package.json, lockfile,</text>
  <text x="45" y="288" class="m">.npmrc, workspace manifests</text>
  <path d="M130,150 L130,220" class="ln"/>

  <!-- deps -->
  <rect x="280" y="80" width="230" height="90" rx="10" class="box"/>
  <text x="295" y="106" class="b">deps</text>
  <text x="295" y="128" class="m">npm ci --ignore-scripts</text>
  <text x="295" y="148" class="m">-w shared, -w backend (+dev)</text>
  <path d="M245,250 L260,250 L260,125 L280,125" class="ln"/>

  <!-- build -->
  <rect x="540" y="80" width="220" height="90" rx="10" class="box"/>
  <text x="555" y="106" class="b">build</text>
  <text x="555" y="128" class="m">tsc: shared, then backend</text>
  <text x="555" y="148" class="m">drop *.d.ts, keep source maps</text>
  <path d="M510,125 L540,125" class="ln"/>

  <!-- prod-deps -->
  <rect x="280" y="290" width="230" height="90" rx="10" class="box"/>
  <text x="295" y="316" class="b">prod-deps</text>
  <text x="295" y="338" class="m">npm ci --omit=dev (fresh)</text>
  <text x="295" y="358" class="m">argon2 musl binding probe</text>
  <path d="M245,270 L260,270 L260,335 L280,335" class="ln"/>

  <!-- runtime -->
  <rect x="540" y="220" width="390" height="260" rx="10" class="box acc"/>
  <text x="555" y="246" class="b">runtime  <tspan class="a">FROM node image again (clean)</tspan></text>
  <text x="555" y="272" class="m">apk add tini, rm npm, npx, corepack, yarn</text>
  <text x="555" y="296" class="m">COPY --from=prod-deps  node_modules</text>
  <text x="555" y="320" class="m">COPY --from=build  backend/dist, packages/shared/dist</text>
  <text x="555" y="344" class="m">COPY  backend/migrations</text>
  <text x="555" y="368" class="m">ENV NODE_OPTIONS=--max-old-space-size=384</text>
  <text x="555" y="392" class="m">USER node, EXPOSE 3100</text>
  <text x="555" y="416" class="m">no HEALTHCHECK (compose probes /health/ready)</text>
  <text x="555" y="440" class="m">ENTRYPOINT ["/sbin/tini","--"]</text>
  <text x="555" y="464" class="m">CMD ["node","--enable-source-maps","dist/main.js"]</text>

  <path d="M650,170 L650,220" class="ln"/>
  <text x="660" y="200" class="m">dist only</text>
  <path d="M510,335 L540,335" class="ln"/>

  <text x="30" y="350" class="m">both npm ci steps share a</text>
  <text x="30" y="370" class="m">BuildKit cache mount (/root/.npm)</text>

  <text x="30" y="420" class="m">Nothing from `deps` or `build` reaches</text>
  <text x="30" y="440" class="m">the final image except compiled output.</text>
  <text x="30" y="464" class="m">TypeScript errors fail the build at `build`;</text>
  <text x="30" y="484" class="m">a missing native binding fails at `prod-deps`.</text>

  <text x="30" y="528" class="m">Figure 9.2 - Multi-stage build: compile with everything, ship only what runs.</text>
</svg>
