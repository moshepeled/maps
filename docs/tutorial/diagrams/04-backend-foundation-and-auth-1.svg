<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Boot sequence and composition root of the Snapland backend">
  <title>Boot sequence and composition root</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b95a4"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #e8ebf0; font-size: 15px; }
      .title { font-size: 21px; font-weight: 600; }
      .h { font-size: 16px; font-weight: 600; }
      .m { fill: #8b95a4; font-size: 14px; }
      .a { fill: #22d3ee; }
      .code { font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 14px; }
      .box { fill: #1a1f26; stroke: #3a4250; stroke-width: 1.5; }
      .hi { stroke: #22d3ee; }
      .ln { stroke: #22d3ee; stroke-width: 2; fill: none; marker-end: url(#arr); }
      .lm { stroke: #8b95a4; stroke-width: 1.5; fill: none; marker-end: url(#arrm); }
    </style>
  </defs>
  <rect width="960" height="600" fill="#111418"/>
  <text x="24" y="38" class="title">Boot sequence and composition root</text>

  <!-- Row 1: the five steps of main.ts -->
  <rect x="24" y="70" width="160" height="60" rx="10" class="box hi"/>
  <text x="104" y="94" text-anchor="middle" class="h code">main.ts</text>
  <text x="104" y="116" text-anchor="middle" class="m">process entry</text>

  <rect x="210" y="70" width="160" height="60" rx="10" class="box"/>
  <text x="290" y="90" text-anchor="middle" class="h code">config/env.ts</text>
  <text x="290" y="108" text-anchor="middle" class="m">loadConfigFromEnv()</text>
  <text x="290" y="124" text-anchor="middle" class="m">zod schema, fail fast</text>

  <rect x="396" y="70" width="160" height="60" rx="10" class="box"/>
  <text x="476" y="94" text-anchor="middle" class="h code">container.ts</text>
  <text x="476" y="116" text-anchor="middle" class="m">createContainer(config)</text>

  <rect x="582" y="70" width="160" height="60" rx="10" class="box"/>
  <text x="662" y="94" text-anchor="middle" class="h code">app.ts</text>
  <text x="662" y="116" text-anchor="middle" class="m">buildApp(container)</text>

  <rect x="768" y="70" width="168" height="60" rx="10" class="box"/>
  <text x="852" y="94" text-anchor="middle" class="h">listen, then start()</text>
  <text x="852" y="116" text-anchor="middle" class="m">modules' background work</text>

  <line x1="184" y1="100" x2="208" y2="100" class="ln"/>
  <line x1="370" y1="100" x2="394" y2="100" class="ln"/>
  <line x1="556" y1="100" x2="580" y2="100" class="ln"/>
  <line x1="742" y1="100" x2="766" y2="100" class="ln"/>

  <!-- Vertical arrows into the two big boxes -->
  <line x1="476" y1="130" x2="476" y2="178" class="ln"/>
  <text x="488" y="160" class="m">builds</text>
  <line x1="662" y1="130" x2="662" y2="178" class="ln"/>
  <text x="674" y="160" class="m">registers each module</text>

  <!-- Container box -->
  <rect x="24" y="180" width="560" height="310" rx="12" class="box"/>
  <text x="44" y="206" class="h">Container: the only place that wires implementations</text>

  <text x="44" y="238" class="code">logger (pino)</text>
  <text x="44" y="264" class="code">clock</text>
  <text x="44" y="290" class="code">metrics (own Registry)</text>
  <text x="44" y="316" class="code">db (pg pool)</text>
  <text x="44" y="342" class="code">redis { cmd, sub, cache }</text>
  <text x="44" y="368" class="code">keys (Redis key names)</text>
  <text x="44" y="394" class="code">events (RedisEventBus)</text>

  <text x="300" y="238" class="code">drawRateLimiter, areaCache</text>
  <text x="300" y="264" class="code">audit, auditCoalescer</text>
  <text x="300" y="290" class="code a">accessTokens (jose, HS256)</text>
  <text x="300" y="316" class="code a">wsTickets (Redis SET / GETDEL)</text>
  <text x="300" y="342" class="code a">revocations (Redis EXISTS)</text>
  <text x="300" y="368" class="code">sessions, users, areasReader</text>
  <text x="300" y="394" class="code">drafts</text>

  <text x="44" y="428" class="m">Wiring order: config -> logger -> clock -> metrics -> db -> redis -> keys -> events</text>
  <text x="44" y="450" class="m">-> limiter/cache/audit -> tokens/tickets/revocations -> read ports -> drafts.</text>
  <text x="44" y="472" class="m">close() runs the reverse order and is idempotent.</text>

  <!-- Modules box -->
  <rect x="620" y="180" width="316" height="310" rx="12" class="box"/>
  <text x="640" y="206" class="h">Modules (APP_MODULES, in order)</text>
  <text x="640" y="238" class="code">1  health</text>
  <text x="640" y="264" class="code">2  meta</text>
  <text x="640" y="290" class="code a">3  auth</text>
  <text x="640" y="316" class="code">4  areas</text>
  <text x="640" y="342" class="code">5  realtime</text>
  <text x="640" y="368" class="code">6  admin</text>
  <text x="640" y="394" class="code">7  retention</text>
  <text x="640" y="458" class="m">factory(container) -> register(app) -> start()</text>
  <text x="640" y="478" class="m">stop() runs in reverse order</text>

  <line x1="584" y1="330" x2="618" y2="330" class="lm"/>
  <text x="586" y="318" class="m">injected</text>

  <text x="24" y="530" class="m">Every container owns its logger, metrics registry, pool, Redis clients and timers, so several app instances</text>
  <text x="24" y="552" class="m">can live in one process (the two-instance integration tests do exactly that). Only main.ts touches process.exit.</text>
</svg>
