<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t2 d2">
  <title id="t2">The workspace mode machine: the nine values of Mode and their main transitions</title>
  <desc id="d2">Left column: browse, drawing, naming, saving-new. Middle column: area-selected, editing-shape, saving-edit, resolving-conflict. Right: previewing-version. Arrows show which key or button moves between them.</desc>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b95a4"/>
    </marker>
    <marker id="c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="960" height="580" fill="#111418"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#e8ebf0" font-size="14">
    <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="600">Exactly one mode at a time: it decides what a map click means</text>

    <!-- nodes -->
    <g fill="#1a1e25" stroke="#3a414c" stroke-width="1.4">
      <rect x="60" y="90" width="160" height="44" rx="10" stroke="#22d3ee"/>
      <rect x="60" y="210" width="160" height="44" rx="10" stroke="#22d3ee"/>
      <rect x="60" y="330" width="160" height="44" rx="10"/>
      <rect x="60" y="450" width="160" height="44" rx="10"/>
      <rect x="400" y="90" width="160" height="44" rx="10" stroke="#22d3ee"/>
      <rect x="400" y="210" width="160" height="44" rx="10" stroke="#22d3ee"/>
      <rect x="400" y="330" width="160" height="44" rx="10"/>
      <rect x="400" y="450" width="160" height="44" rx="10"/>
      <rect x="740" y="90" width="160" height="44" rx="10"/>
    </g>
    <g text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">
      <text x="140" y="117">browse</text>
      <text x="140" y="237">drawing</text>
      <text x="140" y="357">naming</text>
      <text x="140" y="477">saving-new</text>
      <text x="480" y="117">area-selected</text>
      <text x="480" y="237">editing-shape</text>
      <text x="480" y="357">saving-edit</text>
      <text x="480" y="477">resolving-conflict</text>
      <text x="820" y="117">previewing-version</text>
    </g>

    <!-- arrows -->
    <g stroke="#8b95a4" stroke-width="1.6" fill="none" marker-end="url(#a2)">
      <line x1="120" y1="134" x2="120" y2="210"/>
      <line x1="160" y1="210" x2="160" y2="134"/>
      <line x1="120" y1="254" x2="120" y2="330"/>
      <line x1="160" y1="330" x2="160" y2="254"/>
      <line x1="120" y1="374" x2="120" y2="450"/>
      <line x1="160" y1="450" x2="160" y2="374" stroke-dasharray="5 4"/>
      <line x1="220" y1="104" x2="400" y2="104"/>
      <line x1="400" y1="124" x2="220" y2="124"/>
      <line x1="460" y1="134" x2="460" y2="210"/>
      <line x1="500" y1="210" x2="500" y2="134"/>
      <line x1="460" y1="254" x2="460" y2="330"/>
      <line x1="500" y1="330" x2="500" y2="254" stroke-dasharray="5 4"/>
      <line x1="460" y1="374" x2="460" y2="450"/>
      <line x1="500" y1="450" x2="500" y2="374"/>
      <path d="M400,472 C340,472 340,232 400,232"/>
      <polyline points="540,90 540,62 820,62 820,90"/>
      <line x1="740" y1="100" x2="560" y2="100"/>
    </g>
    <g stroke="#22d3ee" stroke-width="1.6" fill="none" marker-end="url(#c2)">
      <path d="M560,352 C660,352 660,116 560,116"/>
      <polyline points="140,494 140,522 700,522 700,128 560,128"/>
    </g>

    <!-- labels -->
    <g font-size="14" fill="#8b95a4">
      <text x="112" y="176" text-anchor="end">D / Draw area</text>
      <text x="168" y="176">Esc / Cancel</text>
      <text x="112" y="296" text-anchor="end">Finish, valid</text>
      <text x="168" y="296">Back / Esc</text>
      <text x="112" y="416" text-anchor="end">Save area</text>
      <text x="168" y="416">failed: kept</text>
      <text x="310" y="96" text-anchor="middle">click area / list</text>
      <text x="310" y="142" text-anchor="middle">Esc / empty map</text>
      <text x="452" y="176" text-anchor="end">E / Edit shape</text>
      <text x="508" y="176">Esc / Cancel</text>
      <text x="452" y="296" text-anchor="end">Save (Enter)</text>
      <text x="508" y="296">failed: kept</text>
      <text x="452" y="416" text-anchor="end">409 conflict</text>
      <text x="508" y="416">Keep mine / merged</text>
      <text x="346" y="356" text-anchor="end">Decide later</text>
      <text x="680" y="56" text-anchor="middle">pick a version in History</text>
      <text x="650" y="94" text-anchor="middle">Restore / Exit preview</text>
      <text x="668" y="300" text-anchor="middle" fill="#22d3ee">saved</text>
      <text x="420" y="514" text-anchor="middle" fill="#22d3ee">created -> the new area is selected</text>
    </g>
    <text x="480" y="548" text-anchor="middle" font-size="14" fill="#8b95a4">Source: workspaceStore.ts `Mode`; the full diagram and the per-mode click table are in UX.md section 3.4.</text>
    <text x="480" y="568" text-anchor="middle" font-size="14" fill="#8b95a4">DeletedWhileEditing is a dialog shown over editing-shape, not a mode.</text>
  </g>
</svg>
