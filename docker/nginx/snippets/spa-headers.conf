# Security headers for the SPA's own responses (SPEC section 10.7.6); API responses get theirs from @fastify/helmet.
# img-src lists the tile hosts the SPA loads directly: OpenStreetMap, Esri and the GovMap 2022 ITM cache (D-1).
# style-src needs 'unsafe-inline' because Leaflet positions tiles and markers with inline styles.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://server.arcgisonline.com https://cdn.govmap.gov.il; connect-src 'self' ws: wss:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
# strict-origin-when-cross-origin, not no-referrer: OpenStreetMap's tile policy requires a Referer. Only the origin
# is sent cross-site, never the path.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
