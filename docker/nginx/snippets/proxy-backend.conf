# Plain HTTP proxying to the backend replicas (/api/, /docs, /health/). /ws configures its own retry and timeout rules.
include snippets/proxy-headers.conf;
proxy_pass http://snapland_backend;
# An empty Connection header lets nginx reuse the upstream keepalive pool (`keepalive 32`).
proxy_set_header Connection "";

# The backends time out handlers at REQUEST_TIMEOUT_MS (10 s), so 30 s only catches a wedged process.
proxy_send_timeout 30s;
proxy_read_timeout 30s;

# Fail over to the other replica when one is unreachable or has closed the connection. No `non_idempotent`: a write is
# never replayed. No http_503: the backend answers 503 legitimately (pool exhausted, draining), and counting those as
# peer failures (max_fails) turned a partial overload into "no live upstreams" on every route.
proxy_next_upstream error timeout http_502;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 10s;

# 512 KiB in memory per response; bigger bbox pages spill to the /tmp tmpfs rather than holding a backend socket.
proxy_buffer_size 16k;
proxy_buffers 32 16k;
proxy_busy_buffers_size 64k;
