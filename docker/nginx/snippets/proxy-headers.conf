# Request headers for every proxied location (SPEC section 10.7.6).
#
# nginx is the only edge, so it overwrites the forwarding headers and never appends to what a client sent. With
# $proxy_add_x_forwarded_for, a client could prepend spoofed hops. The backends trust exactly one hop (TRUST_PROXY=1),
# so per-IP rate limits and audit IPs rely on this.
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
# The backends do not parse RFC 7239 `Forwarded`. An empty value drops a client-supplied one, so no second, unchecked
# claim reaches them.
proxy_set_header Forwarded "";
# Correlation id shared by the access log, the backend logs, audit rows and the X-Request-Id response header.
proxy_set_header X-Request-Id $snapland_request_id;
