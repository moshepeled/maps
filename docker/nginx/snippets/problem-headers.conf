# Headers of the problem+json responses nginx generates itself (413, 502/503/504 gateway errors). They mirror what the
# backend sends with its own problems: correlation id, never cached, no MIME sniffing.
add_header X-Request-Id $snapland_request_id always;
add_header Cache-Control "no-store" always;
add_header X-Content-Type-Options "nosniff" always;
