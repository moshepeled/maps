# Snapland edge (SPEC section 11.1, section 10.7.6, user decision D-2): serves the built SPA and reverse-proxies /api/, /docs,
# /health/ and /ws to both backend replicas. Runs unprivileged (uid 101) on a read-only root filesystem; everything it
# writes lives in /tmp (tmpfs). The configuration is static; nothing is templated at start-up.

# The master is PID 1 in the container, so nginx must stay in the foreground.
daemon off;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

# `auto` would read the host's CPU count and ignore the container's 1-CPU limit.
worker_processes 2;
# Each proxied WebSocket holds two connections (client + upstream): 2 workers x 8192 with headroom.
worker_rlimit_nofile 32768;
# WebSockets never finish on their own, so a graceful stop closes them after 10 s (inside the 15 s stop_grace_period).
worker_shutdown_timeout 10s;

events {
  worker_connections 8192;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;

  # Request limits. The body limit matches BODY_LIMIT_BYTES (262144): larger bodies are rejected here, before they cost
  # a backend anything. A body up to that size stays in memory (no temp file).
  client_max_body_size 256k;
  client_body_buffer_size 256k;
  client_header_timeout 15s;
  client_body_timeout 15s;
  send_timeout 30s;

  # All temp paths are on the /tmp tmpfs. nginx creates only the last path segment, so each is a direct child of /tmp.
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  # -- Logging ---------------------------------------------------------------------------------------------------------
  # A client X-Request-Id is kept only when it passes the backend's rule (shared LIMITS.requestIdPattern), so the
  # access log, the backend logs and the problem+json bodies share one id and a hostile header cannot inject log text.
  map $http_x_request_id $snapland_request_id {
    default $request_id;
    '~^[A-Za-z0-9._-]{1,64}$' $http_x_request_id;
  }

  # `$uri` without `$args`, never `$request`: WebSocket tickets travel in the query string and must never reach a log
  # (SPEC section 7.2, section 10.7.6). The upstream address shows which replica served the request.
  log_format snapland '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent $request_time '
                      'rid=$snapland_request_id upstream=$upstream_addr';
  access_log /dev/stdout snapland;

  # -- Compression -----------------------------------------------------------------------------------------------------
  # On-the-fly gzip for API JSON (bbox pages reach ~3.6 MB) and for any asset without a pre-compressed .gz twin.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/json application/problem+json application/geo+json application/javascript
             text/javascript text/css text/plain image/svg+xml application/manifest+json;

  # -- Upstream --------------------------------------------------------------------------------------------------------
  # Docker's embedded DNS. With `resolve` on each server, nginx starts even while a replica is down and follows a
  # recreated container to its new IP without a reload.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 3s;

  # A stopped replica's IP drops SYNs silently, so this is the delay a request pays before failing over to the other one.
  proxy_connect_timeout 1s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream snapland_backend {
    # Required by `resolve`: the re-resolved peer list is shared by all workers.
    zone snapland_backend 64k;
    # least_conn balances long-lived WebSockets better than round-robin (SPEC section 10.10). No sticky sessions: tickets,
    # presence and fan-out live in Redis, so any replica accepts any client.
    least_conn;
    server backend-1:3100 max_fails=3 fail_timeout=10s resolve;
    server backend-2:3100 max_fails=3 fail_timeout=10s resolve;
    keepalive 32;
    keepalive_timeout 60s;
  }

  server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Relative redirects: the container port (80) differs from the published one (5173).
    absolute_redirect off;

    # nginx-generated gateway and body-size errors on API paths keep the problem+json contract (SPEC section 3.5).
    error_page 413 = @problem_payload_too_large;
    error_page 502 503 = @problem_unavailable;
    error_page 504 = @problem_timeout;

    # Liveness of nginx itself (compose healthcheck). Deliberately independent of the backends.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # -- API ---------------------------------------------------------------------------------------------------------
    location /api/ {
      include snippets/proxy-backend.conf;
    }

    # Auth responses carry tokens next to request-controlled data; not compressing them rules out BREACH-style
    # length oracles.
    location /api/v1/auth/ {
      gzip off;
      include snippets/proxy-backend.conf;
    }

    # OpenAPI UI and JSON (swagger-ui sets its own CSP through helmet).
    location ^~ /docs {
      include snippets/proxy-backend.conf;
    }

    # /health/live and /health/ready of whichever replica answers (for aggregate status, query each replica directly).
    location ^~ /health/ {
      include snippets/proxy-backend.conf;
    }

    # -- WebSocket (snapland.v1) -------------------------------------------------------------------------------------
    location = /ws {
      # The single-use ticket travels in the query string. The access log omits it ($uri), but every error-log line
      # quotes the full request line, so a replica restart would log still-valid tickets (SPEC section 7.2).
      error_log /dev/null;
      include snippets/proxy-headers.conf;
      proxy_pass http://snapland_backend;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # The server pings every 20 s (WS_PING_INTERVAL_MS); 75 s tolerates missed pings on healthy sockets.
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
      # Retry only failures to reach a replica: once an upgrade reaches a backend, its single-use ticket is consumed.
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 2;
    }

    # -- SPA ---------------------------------------------------------------------------------------------------------
    # Vite's content-hashed bundles never change under the same name, so they are cached for a year. A missing asset is
    # a real 404, never index.html served as JavaScript.
    location ^~ /assets/ {
      gzip_static on;
      include snippets/spa-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Client-side routes (/, /signin, /signup) fall back to the SPA. index.html and the files from public/ are
    # revalidated on every load (ETag, no-cache), so a new deploy is picked up immediately.
    location / {
      gzip_static on;
      include snippets/spa-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;

      # A path that names a file (favicon.ico, robots.txt) is a real 404 when missing, never the SPA shell. Client
      # routes never contain a dot. Nested here, the regex only sees URIs that already matched `/`.
      location ~ \.[A-Za-z0-9]+$ {
        gzip_static on;
        include snippets/spa-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
      }
    }

    # -- Problem responses generated by nginx itself -----------------------------------------------------------------
    location @problem_payload_too_large {
      default_type application/problem+json;
      include snippets/problem-headers.conf;
      return 413 '{"type":"urn:snapland:problem:payload-too-large","title":"Payload too large","status":413,"code":"PAYLOAD_TOO_LARGE","detail":"The request body exceeds 262144 bytes.","requestId":"$snapland_request_id"}';
    }

    # No replica reachable: 503 SERVICE_UNAVAILABLE, like the backend's own shutdown answer; the client retries after
    # Retry-After.
    location @problem_unavailable {
      default_type application/problem+json;
      include snippets/problem-headers.conf;
      add_header Retry-After 5 always;
      return 503 '{"type":"urn:snapland:problem:service-unavailable","title":"Service unavailable","status":503,"code":"SERVICE_UNAVAILABLE","detail":"No backend instance is available. Reference: $snapland_request_id","requestId":"$snapland_request_id"}';
    }

    location @problem_timeout {
      default_type application/problem+json;
      include snippets/problem-headers.conf;
      add_header Retry-After 5 always;
      return 503 '{"type":"urn:snapland:problem:request-timeout","title":"Request timeout","status":503,"code":"REQUEST_TIMEOUT","detail":"The backend did not answer in time. Reference: $snapland_request_id","requestId":"$snapland_request_id"}';
    }
  }
}
